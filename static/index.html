<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音主页视频批量分析工具</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f5f6f8; margin: 0; padding: 24px; color: #222; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 16px; }
  label { display:block; font-size: 14px; margin: 10px 0 6px; font-weight: 600; }
  input, textarea { width: 100%; padding: 10px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 14px; }
  textarea { resize: vertical; }
  .row { display:flex; gap:12px; align-items:center; }
  .row input { flex:1; }
  button { background:#fe2c55; color:#fff; border:none; padding:12px 28px; border-radius:6px; font-size:15px; cursor:pointer; }
  button:disabled { background:#f8a3b3; cursor:not-allowed; }
  details { margin-top: 10px; background:#fafafa; padding:10px; border-radius:6px; font-size:13px; color:#555; }
  .progress { display:none; }
  .bar { height:10px; background:#eee; border-radius:5px; overflow:hidden; margin:10px 0; }
  .bar > div { height:100%; background:#fe2c55; width:0%; transition: width .3s; }
  #msg { font-size:14px; }
  .stage { font-size:12px; color:#999; margin-top:4px; }
  .result-btn { display:none; background:#07c160; margin-top:14px; }
  .err { color:#e53935; }
</style>
</head>
<body>
<div class="wrap">
  <h1>抖音主页视频批量分析工具</h1>
  <div class="sub">粘贴主页链接 → 自动爬取 / 下载无水印视频 / 本地语音转写口播 / 导出 Excel</div>

  <div class="card">
    <label>抖音主页链接</label>
    <input id="url" placeholder="https://www.douyin.com/user/xxxxxxxx 或 https://v.douyin.com/xxxxxx/">

    <div style="background:#fff8e6; padding:12px; border-radius:6px; margin:10px 0;">
      <b style="color:#d4880f;">第一步：登录抖音</b>
      <div style="margin-top:8px; display:flex; gap:10px; align-items:center;">
        <button id="loginBtn" onclick="startLogin()" style="background:#d4880f; padding:8px 16px; font-size:14px;">一键扫码登录</button>
        <span id="loginStatus" style="font-size:13px; color:#666;">未登录</span>
      </div>
      <div style="font-size:12px; color:#999; margin-top:6px;">点击后会自动弹出 Chrome 窗口，用抖音 APP 扫码登录即可，Cookie 自动保存。</div>
    </div>

    <label>Cookie（一般不用填，登录后自动用）</label>
    <textarea id="cookie" rows="2" placeholder="留空即可，登录后自动读取"></textarea>
    <details>
      <summary>手动填写 Cookie（备用）</summary>
      <p>如果一键登录失败，可手动复制：<br>
         1. 用 Edge/Chrome 打开 <b>douyin.com</b> 并登录你的账号；<br>
         2. 按 F12 打开开发者工具 → Console；<br>
         3. 输入 document.cookie 回车，复制输出内容粘到这里。</p>
    </details>

    <label>最多处理视频数（留空 = 全部）</label>
    <input id="maxv" type="number" placeholder="例如 20，不填则处理全部">

    <div style="margin-top:16px;">
      <button id="startBtn" onclick="start()">开始分析</button>
    </div>
  </div>

  <div class="card progress" id="progCard">
    <b>任务进度</b>
    <div class="bar"><div id="bar"></div></div>
    <div id="msg"></div>
    <div class="stage" id="stage"></div>
    <a id="dlBtn" class="result-btn" download>
      <button class="result-btn" onclick="download()">下载 Excel</button>
    </a>
  </div>
</div>

<script>
let timer = null, tid = null, loginPollTimer = null;

function setMsg(m, cls){ document.getElementById('msg').innerHTML = m; }

function startLogin(){
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = '正在弹出窗口...';
  document.getElementById('loginStatus').textContent = '正在弹出登录窗口...';

  fetch('/api/login/start', {method:'POST'}).then(r=>r.json()).then(d=>{
    if(!d.ok){ alert(d.msg); btn.disabled=false; btn.textContent='一键扫码登录'; return; }
    // 开始轮询登录状态
    loginPollTimer = setInterval(pollLoginStatus, 1500);
  });
}

function pollLoginStatus(){
  fetch('/api/login/status').then(r=>r.json()).then(d=>{
    const el = document.getElementById('loginStatus');
    const btn = document.getElementById('loginBtn');
    if(d.status === 'waiting_login'){
      el.textContent = '等待扫码...请在弹出的 Chrome 窗口里扫码';
      el.style.color = '#d4880f';
    } else if(d.status === 'success'){
      clearInterval(loginPollTimer);
      el.textContent = '✓ 登录成功，可以开始分析了';
      el.style.color = '#07c160';
      btn.disabled = false;
      btn.textContent = '重新登录';
    } else if(d.status === 'failed'){
      clearInterval(loginPollTimer);
      el.textContent = '✗ ' + (d.error || '登录失败');
      el.style.color = '#e53935';
      btn.disabled = false;
      btn.textContent = '重试登录';
    }
  });
}
function start(){
  const url = document.getElementById('url').value.trim();
  if(!url){ alert('请填写主页链接'); return; }
  const cookie = document.getElementById('cookie').value.trim();
  const maxv = document.getElementById('maxv').value.trim();
  document.getElementById('startBtn').disabled = true;
  document.getElementById('progCard').style.display = 'block';
  fetch('/api/analyze', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({url, cookie, max_videos: maxv? parseInt(maxv): null})
  }).then(r=>r.json()).then(d=>{
    if(!d.ok){ alert(d.msg); document.getElementById('startBtn').disabled=false; return; }
    tid = d.task_id;
    timer = setInterval(poll, 1500);
  });
}
function poll(){
  fetch('/api/status/'+tid).then(r=>r.json()).then(d=>{
    if(!d.ok){ return; }
    const pct = d.total>0 ? Math.round(d.done/d.total*100) : 0;
    document.getElementById('bar').style.width = pct+'%';
    setMsg((d.message||'') + (d.total>0? `（${d.done}/${d.total}）`:''));
    document.getElementById('stage').textContent = '阶段：' + d.status;
    if(d.status==='done'){
      clearInterval(timer);
      document.getElementById('dlBtn').style.display='inline-block';
      document.getElementById('dlBtn').href = '/api/result/'+tid;
      document.getElementById('startBtn').disabled = false;
    } else if(d.status==='failed'){
      clearInterval(timer);
      setMsg('<span class="err">失败：'+(d.error||'')+'</span>');
      document.getElementById('startBtn').disabled = false;
    }
  });
}
function download(){ /* 由 <a> 的 href 直接触发 */ }
</script>
</body>
</html>
